<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 눈도우미 무료</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:620px;margin:auto;padding:22px;background:#f7f9fc;color:#15223a}h1{font-size:29px}button,.pick{display:block;box-sizing:border-box;width:100%;padding:19px;border:0;border-radius:14px;background:#165dcc;color:white;font-size:20px;font-weight:bold;text-align:center;margin:14px 0;cursor:pointer}.secondary{background:#34465f}input{display:none}img{max-width:100%;max-height:300px;border-radius:12px;object-fit:contain}#output{white-space:pre-wrap;background:white;border-radius:14px;padding:18px;min-height:100px;font-size:19px;line-height:1.6}#status{font-weight:bold}small{color:#526078}button:focus-visible,.pick:focus-visible{outline:4px solid orange}</style></head><body><h1>👁️ AI 눈도우미</h1><p>상품의 글자를 읽어 한국어로 안내합니다.</p><label class="pick" for="photo">📷 상품 촬영 또는 사진 선택</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" alt="선택한 상품 사진" hidden><button id="analyze" disabled>🔎 글자 인식하기</button><p id="status" role="status" aria-live="polite">사진을 선택해 주세요.</p><div id="output" aria-live="polite">여기에 인식된 글자가 표시됩니다.</div><button id="speak" class="secondary" disabled>🔊 한국어로 읽어주기</button><button id="stop" class="secondary">⏹ 음성 중지</button><small>무료 시연용: 포장지의 글자를 인식하는 OCR이며 정확한 상품명·성분·알레르기 정보를 보장하지 않습니다. 중요한 정보는 반드시 제품 표시를 직접 확인하세요. 첫 실행 시 언어 모델을 다운로드하므로 인터넷이 필요합니다. 이미지는 이 웹페이지에서 처리하며 별도 분석 서버로 전송하지 않도록 설계했습니다. 다만 OCR 라이브러리와 언어 모델은 외부 CDN에서 내려받습니다.</small><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>const photo=document.getElementById('photo'),preview=document.getElementById('preview'),analyze=document.getElementById('analyze'),status=document.getElementById('status'),output=document.getElementById('output'),speak=document.getElementById('speak');let url=null,worker=null;photo.addEventListener('change',()=>{const file=photo.files?.[0];if(!file)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);preview.src=url;preview.hidden=false;analyze.disabled=false;speak.disabled=true;output.textContent='인식 버튼을 눌러 주세요.';status.textContent='사진이 준비되었습니다.'});analyze.addEventListener('click',async()=>{if(!url)return;analyze.disabled=true;status.textContent='글자를 분석하고 있습니다. 첫 실행은 시간이 걸릴 수 있습니다.';try{if(!worker)worker=await Tesseract.createWorker('kor+eng',1,{logger:m=>{if(m.status==='recognizing text')status.textContent='글자 인식 중: '+Math.round((m.progress||0)*100)+'%';}});const result=await worker.recognize(url);const value=(result.data.text||'').trim();output.textContent=value||'읽을 수 있는 글자를 찾지 못했습니다. 포장지 글자가 크게 보이도록 다시 촬영해 주세요.';status.textContent=value?'인식 완료. 결과를 확인해 주세요.':'인식할 글자가 없습니다.';speak.disabled=!value}catch(e){status.textContent='인식에 실패했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.';output.textContent=String(e.message||e)}finally{analyze.disabled=false}});speak.addEventListener('click',()=>{speechSynthesis.cancel();const msg=new SpeechSynthesisUtterance(output.textContent);msg.lang='ko-KR';msg.rate=.85;speechSynthesis.speak(msg)});document.getElementById('stop').addEventListener('click',()=>speechSynthesis.cancel());</script></body></html>
